# The data job for mycfbbigboard.com: builds the shared data and publishes it to the site. Started by the site's own scheduler
# (Cloudflare) through workflow_dispatch, or by hand. Nothing here runs on pull requests or pushes.
# Published from the site's private repo by tools/sync-jobs.mjs — edit it there.
name: Data job

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "live · catchup · weekly · look · qb · views · avail · coaches · cdef · nfl · nflhistory · nfldraft · history · full"
        default: live
        type: choice
        options: [live, cavail, look, probe, extras, honors, catchup, weekly, qb, views, avail, coaches, cdef, dgtest, oltest, grtest, nfl, nflhistory, nfldraft, history, full, colgap, style, punt, prefetch, nflhof, study, pbpfill, nflpick, cfbpick]
      page:
        description: "Which version of the site runs the build: / (live) or /lab/"
        default: "/"
        type: choice
        options: ["/", "/lab/"]
      probe:
        description: "MODE=probe: which probes (names from job/probes.mjs, comma-separated; empty = all) · MODE=study: which batches (job/study.mjs; empty = all)"
        default: ""
        type: string
      dry:
        description: "MODE=prefetch / nflhof / pbpfill: a dry run — prefetch lists what it would ask CFBD for; nflhof reads and reports but writes nothing; pbpfill lists the seasons, pack sizes and CFBD calls"
        default: false
        type: boolean
      seasons:
        description: "MODE=pbpfill only: which past seasons, e.g. 2014-2025 or 2014,2016 (empty = 2014 to last season)"
        default: ""
        type: string

# read-only: the job only reads public data and talks to the site with its token
permissions:
  contents: read

# never two runs at once — a new one waits for the one in progress
concurrency:
  group: data-job
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned (Refine 2, audit 2 D2-05): ubuntu-latest moves to Ubuntu 26, which nothing here has been tested on
    timeout-minutes: 330
    steps:
      - name: Decide what kind of run this is
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          [ "$MODE" = "full" ] && MODE=weekly
          CATCHUP=0
          [ "$MODE" = "catchup" ] && MODE=live && CATCHUP=1
          [ "${{ github.event.schedule }}" = "5 10 * * 0" ] && CATCHUP=1
          echo "catchup=$CATCHUP" >> $GITHUB_OUTPUT
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "15 10 * * 1,2" ]; then MODE=weekly
            elif [ "${{ github.event.schedule }}" = "0 23 * * 3,5" ]; then MODE=nfl
            elif [ "${{ github.event.schedule }}" = "35 11 * * 0" ]; then MODE=cdef
            elif [ "${{ github.event.schedule }}" = "50 11 * * 1-6" ]; then MODE=nfl
            else MODE=live; fi
          fi
          # outside the season (February – July) the game-day runs have nothing to do
          M=$(date -u +%-m)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$MODE" = "live" ] && [ $M -ge 2 ] && [ $M -le 7 ]; then
            echo "Off-season — skipping game-day run."; echo "skip=1" >> $GITHUB_OUTPUT
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Mode: $MODE"

      - uses: actions/checkout@v5
        if: steps.mode.outputs.skip != '1'

      - uses: actions/setup-node@v5
        if: steps.mode.outputs.skip != '1'
        with:
          node-version: 24

      - name: Install the headless browser
        if: steps.mode.outputs.skip != '1' && steps.mode.outputs.mode != 'cavail'
        run: |
          npm install --no-save "playwright@>=1.0 <1.65"
          npx playwright install --with-deps chromium

      - name: Build and publish
        if: steps.mode.outputs.skip != '1'
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://mycfbbigboard.com' }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
          CATCHUP: ${{ steps.mode.outputs.catchup }}
          PAGE_PATH: ${{ github.event.inputs.page || '/' }}
          PROBE: ${{ github.event.inputs.probe || '' }}
          STUDY: ${{ github.event.inputs.probe || '' }}
          PREFETCH_DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
          PBPFILL_SEASONS: ${{ github.event.inputs.seasons || '' }}
        run: node job/build.mjs

      # MODE=study (job/study.mjs): the pulls sit in study-data/ on this runner only; the analysis (job/study3/, published from cfb-board
      # docs/research/patternhunt3/) prints results as notices, 10 a step — nothing raw is uploaded, and the runner is wiped after
      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode == 'study'
        with:
          python-version: "3.12"
      - name: Study analysis tools
        if: steps.mode.outputs.mode == 'study'
        run: pip install --quiet --no-input numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Study analysis (results 1)
        if: steps.mode.outputs.mode == 'study' && hashFiles('study-data/manifest.json') != '' && hashFiles('job/study3/run.py') != ''
        run: python3 -I job/study3/run.py study-data 1
      - name: Study analysis (results 2)
        if: steps.mode.outputs.mode == 'study' && hashFiles('study-data/manifest.json') != '' && hashFiles('job/study3/run.py') != ''
        run: python3 -I job/study3/run.py study-data 2
      - name: Study analysis (results 3)
        if: steps.mode.outputs.mode == 'study' && hashFiles('study-data/manifest.json') != '' && hashFiles('job/study3/run.py') != ''
        run: python3 -I job/study3/run.py study-data 3
