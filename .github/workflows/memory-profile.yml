# Where a tab's memory goes (job/memprofile.mjs, Nov 1): opens a board signed in as the site's probe (read-only), visits every page
# twice, and prints the tab's memory after each page plus the biggest things the page holds. Measurement only. WebKit is Safari's
# engine (on Linux, so close to Safari but not the same numbers). Published from the site's private repo by tools/sync-jobs.mjs — edit it there.
name: Memory profile
on:
  workflow_dispatch:
    inputs:
      rounds:
        default: "2"
        type: string
      page:
        default: "/"
        type: choice
        options: ["/", "/lab/", "/lab/?nav2", "/cbb/lab/", "/cbb/lab/?nav2"]
      compare:
        description: "other sites to measure first (comma-separated), for comparison"
        default: ""
        type: string
      idle:
        description: "1 = after each page, sit still 2 s and log what keeps redrawing"
        default: ""
        type: string
      start:
        description: "pro = open on the pro side (football), then flip College / Pros quickly and time the college board"
        default: ""
        type: string
      sites:
        default: "both"
        type: choice
        options: ["both", "football", "basketball"]
permissions:
  contents: read
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
        site: ${{ fromJSON(github.event.inputs.sites == 'football' && '["football"]' || github.event.inputs.sites == 'basketball' && '["basketball"]' || '["football","basketball"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: |
          npm install --no-save "playwright@>=1.0 <1.65"
          npx playwright install --with-deps ${{ matrix.browser }}
      - env:
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          BROWSER: ${{ matrix.browser }}
          SITE: ${{ matrix.site }}
          ROUNDS: ${{ github.event.inputs.rounds || '2' }}
          PAGE_PATH: ${{ github.event.inputs.page || '/' }}
          COMPARE: ${{ github.event.inputs.compare }}
          IDLE: ${{ github.event.inputs.idle }}
          START: ${{ github.event.inputs.start }}
        run: node job/memprofile.mjs | tee mem.txt
      - if: always()
        run: echo "$(head -c 60000 mem.txt)" >> $GITHUB_STEP_SUMMARY
