# The referee history backfill for mycbbbigboard.com (job/cbb.mjs, MODE=refhist → job/cbbrefhist.mjs): ESPN's game pages for every college
# and NBA game back to 2002–03, read slowly, then the totals the referee and coach pages use. The history is in (Nov 2026); each run now
# folds in the games the basketball run just saved. No CollegeBasketballData calls. Published from the site's private repo by tools/sync-jobs.mjs — edit it there.
name: Referee history

on:
  # started by the site's own clock 30 min after each basketball run (src/api/snap.js refhistDue — Nov 10: the backfill is done and a run
  # only rebuilds totals from the games that run saved; it was every 6 hours on GitHub's clock)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refhist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned (Refine 2, audit 2 D2-05): ubuntu-latest moves to Ubuntu 26, which nothing here has been tested on
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Backfill and totals
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://mycfbbigboard.com' }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          MODE: refhist
          NODE_OPTIONS: --max-old-space-size=6144
        run: node job/cbb.mjs
